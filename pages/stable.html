<!doctype html>
<html><head><style>
body { margin: 0; font: 16px/1.4 Arial, sans-serif; background: #f4f5f7; }
.card { margin: 20px; padding: 16px; width: 328px; background: #fff; border: 1px solid #d0d4da; border-radius: 6px; }
h1 { margin: 0 0 8px; font-size: 18px; }
.track { position: relative; height: 12px; background: #e3e6ea; border-radius: 6px; overflow: hidden; }
#bar { position: absolute; top: 0; left: 0; width: 60px; height: 12px; background: #2b6cb0; }
#clock { margin-top: 12px; font-family: monospace; }

</style></head><body>
<div class="card">
  <h1>Build status</h1>
  <div class="track"><div id="bar"></div></div>
  <div id="clock">Updated 12:00:00.000</div>
</div>

</body></html>
